apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "solana-streamer.fullname" . }}
  labels:
    {{- include "solana-streamer.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  HTTP_PORT: {{ .Values.service.port | quote }}
