{{- if not .Values.rpc.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "solana-streamer.fullname" . }}
  labels:
    {{- include "solana-streamer.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.rpc.existingSecretKey }}: {{ required "rpc.url or rpc.existingSecret is required" .Values.rpc.url | quote }}
{{- end }}
